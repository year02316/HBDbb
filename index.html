<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <title>Stego &amp; Snail — Pixel Maze</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7e4ff;
      --pink: #ff4f8b;
      --night: #101225;
      --panel: #1b1d38;
      --grass: #25334b;
      --grass-dark: #1b2940;
      --tile: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--ink);
      background: var(--night); font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: .14;
      background: repeating-linear-gradient(0deg, transparent 0 3px, #090a16 3px 4px);
    }
    button { font: inherit; color: inherit; }
    .page { min-height: 100vh; position: relative; isolation: isolate; overflow: hidden; }
    .hearts { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
    .heart {
      --size: 16px; --duration: 12s; --drift: 35px;
      position: absolute; bottom: -40px; left: var(--left); width: var(--size); height: var(--size);
      background: #ff4f8b; opacity: .48; transform: rotate(45deg);
      animation: float-up var(--duration) linear infinite; animation-delay: var(--delay);
      image-rendering: pixelated; box-shadow: 0 0 12px #ff4f8b66;
    }
    .heart::before, .heart::after { content: ""; position: absolute; width: 100%; height: 100%; background: inherit; }
    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; left: -50%; }
    @keyframes float-up {
      0% { translate: 0 0; rotate: 0deg; opacity: 0; }
      12% { opacity: .5; }
      85% { opacity: .42; }
      100% { translate: var(--drift) -115vh; rotate: 25deg; opacity: 0; }
    }
    main { width: min(940px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 48px; }
    header { text-align: center; margin-bottom: 20px; }
    .eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #43e6d0; font-weight: bold; text-shadow: 0 0 10px #43e6d066; }
    h1 { margin: 9px 0 5px; font-size: clamp(26px, 5vw, 48px); line-height: 1.1; color: #fff2ad; text-shadow: 4px 4px 0 #9c3d7a, 0 0 18px #ff4f8b55; }
    .subtitle { margin: 0; color: #a7aacb; font-size: 14px; }
    .game-shell {
      background: var(--panel); border: 4px solid #6c63a8; padding: 12px;
      box-shadow: 8px 8px 0 #080914, 0 0 0 4px #272849, 0 0 30px #6555a833;
      max-width: 820px; margin: 24px auto 0;
    }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 2px 4px 11px; font-weight: bold; font-size: 13px; }
    .hud .goal { color: #43e6d0; text-align: center; }
    .badge { background: #292b4d; border: 2px solid #7770b7; padding: 5px 8px; white-space: nowrap; color: #fff2ad; }
    .board-wrap { position: relative; padding: 8px; background: #11182a; border: 3px solid #43e6d0; box-shadow: inset 0 0 18px #070d18; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .message { min-height: 25px; padding: 10px 3px 2px; text-align: center; font-size: 13px; font-weight: bold; color: #d3d4f0; }
    .message.won { color: #43e6d0; text-shadow: 0 0 10px #43e6d066; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 4px 0; }
    .help { font-size: 12px; line-height: 1.6; color: #a7aacb; }
    .reset {
      background: #ff4f8b; color: #1b1024; border: 3px solid #ffd1e1; box-shadow: 3px 3px 0 #080914;
      padding: 8px 11px; font-weight: bold; cursor: pointer;
    }
    .reset:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #080914; }
    .dpad { display: none; grid-template: repeat(2, 38px) / repeat(3, 42px); justify-content: center; gap: 4px; margin: 16px auto 3px; }
    .dpad button { background: #292b4d; border: 2px solid #43e6d0; box-shadow: 2px 2px 0 #080914; font-size: 19px; touch-action: manipulation; }
    .dpad [data-dir="up"] { grid-area: 1 / 2; }
    .dpad [data-dir="left"] { grid-area: 2 / 1; }
    .dpad [data-dir="down"] { grid-area: 2 / 2; }
    .dpad [data-dir="right"] { grid-area: 2 / 3; }
    footer { text-align: center; margin-top: 21px; color: #777b9f; font-size: 11px; }
    @media (max-width: 600px) {
      main { padding-top: 25px; }
      .game-shell { padding: 8px; }
      .hud { font-size: 10px; gap: 5px; }
      .badge { padding: 4px 5px; }
      .dpad { display: grid; }
      .controls { align-items: flex-start; }
      .help { max-width: 68%; }
      .board-wrap { padding: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { .heart { animation-duration: 30s; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <main>
      <header>
        <div class="eyebrow">★ 8-bit pixel adventure ★</div>
        <h1>Stego &amp; Snail</h1>
        <p class="subtitle">A bigger maze. More twists. One tiny snail to find.</p>
      </header>
      <section class="game-shell" aria-label="Stegosaurus and snail maze game">
        <div class="hud">
          <span class="badge">♥ <span id="steps">0</span> STEPS</span>
          <span class="goal">FIND YOUR SNAIL FRIEND →</span>
          <span class="badge">LEVEL 02</span>
        </div>
        <div class="board-wrap"><canvas id="maze" aria-label="Large maze game board"></canvas></div>
        <div class="message" id="message" aria-live="polite">Use arrow keys or WASD to guide Stego through the maze.</div>
        <div class="controls">
          <div class="help">MOVE: <b>↑ ↓ ← →</b> or <b>W A S D</b><br>Find the snail in the 31 × 23 maze!</div>
          <button class="reset" id="reset" type="button">↻ RESTART</button>
        </div>
        <div class="dpad" aria-label="Touch controls">
          <button data-dir="up" aria-label="Move up">▲</button>
          <button data-dir="left" aria-label="Move left">◀</button>
          <button data-dir="down" aria-label="Move down">▼</button>
          <button data-dir="right" aria-label="Move right">▶</button>
        </div>
      </section>
      <footer>INSERT COZY VIBES · PRESS START TO WANDER ✦</footer>
    </main>
  </div>
  <script>
    (() => {
      const width = 31, height = 23, tile = 24;
      const canvas = document.getElementById('maze');
      const ctx = canvas.getContext('2d');
      canvas.width = width * tile;
      canvas.height = height * tile;
      let maze, player, steps = 0, won = false;
      const start = { x: 1, y: 1 };
      const goal = { x: width - 2, y: height - 2 };

      // Recursive backtracking carves a connected, twisty maze with many dead ends.
      function makeMaze() {
        const grid = Array.from({ length: height }, () => Array(width).fill('#'));
        const stack = [{ ...start }];
        grid[start.y][start.x] = '.';
        while (stack.length) {
          const current = stack[stack.length - 1];
          const options = [[0, -2], [0, 2], [-2, 0], [2, 0]]
            .map(([dx, dy]) => ({ x: current.x + dx, y: current.y + dy, dx, dy }))
            .filter(next => next.x > 0 && next.x < width - 1 && next.y > 0 && next.y < height - 1 && grid[next.y][next.x] === '#');
          if (!options.length) { stack.pop(); continue; }
          const next = options[Math.floor(Math.random() * options.length)];
          grid[current.y + next.dy / 2][current.x + next.dx / 2] = '.';
          grid[next.y][next.x] = '.';
          stack.push({ x: next.x, y: next.y });
        }
        grid[start.y][start.x] = 'S';
        grid[goal.y][goal.x] = 'G';
        return grid.map(row => row.join(''));
      }

      // 12×12 hand-built sprites use a Game Boy-inspired limited palette.
      function drawSprite(x, y, pixels, palette) {
        const scale = 2;
        pixels.forEach((row, py) => [...row].forEach((value, px) => {
          if (value !== '.') { ctx.fillStyle = palette[value]; ctx.fillRect(x * tile + px * scale, y * tile + py * scale, scale, scale); }
        }));
      }
      const stego = [
        "....dddd....", "...dDDDDd...", "..dDDDDDDd..", ".dDDDDDDDDD.",
        "dDDDDDDDDDDD", "dDDDDDDDDDDD", "dDDDDDDDDDDD", ".dDDDDDDDDD.",
        "..dDDDDDDD..", "...d..d..d...", "...d..d..d...", "..dd..dd..dd."
      ];
      const snail = [
        ".....ssss...", "....sSSSs...", "...sSSSSSs..", "..sSSSSeSs..",
        ".sSSSSSSSs..", "sSSSSSSSSSS.", "sSSSSSSSSSSs", ".sSSSSSSSSs.",
        "..sSSSSSSs..", "...sSSSSs...", "...s..s..s..", "..ss..ss..ss"
      ];

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        maze.forEach((row, y) => [...row].forEach((cell, x) => {
          const px = x * tile, py = y * tile;
          if (cell === '#') {
            ctx.fillStyle = '#303457'; ctx.fillRect(px, py, tile, tile);
            ctx.fillStyle = '#565b86'; ctx.fillRect(px + 1, py + 1, tile - 2, 4);
            ctx.fillStyle = '#202440'; ctx.fillRect(px + 2, py + 6, tile - 4, tile - 8);
            ctx.fillStyle = '#7379a6'; ctx.fillRect(px + 4, py + 11, 3, 3); ctx.fillRect(px + 17, py + 17, 3, 3);
            ctx.fillStyle = '#111326'; ctx.fillRect(px, py + tile - 2, tile, 2);
          } else {
            ctx.fillStyle = '#25334b'; ctx.fillRect(px, py, tile, tile);
            ctx.fillStyle = ((x + y) % 3 === 0) ? '#34465d' : '#1f2c42';
            ctx.fillRect(px + ((x * 7 + y * 3) % 17) + 3, py + ((x * 5 + y * 11) % 17) + 3, 2, 2);
            ctx.fillStyle = '#405365'; ctx.fillRect(px + 4, py + 20, 3, 1);
          }
        }));
        // Small objective marker under the snail adds a classic game collectible glow.
        ctx.fillStyle = '#ffcb5c'; ctx.fillRect(goal.x * tile + 8, goal.y * tile + 20, 8, 2);
        drawSprite(goal.x, goal.y, snail, { s: '#ffcb5c', S: '#d88759', e: '#fff2ad' });
        drawSprite(player.x, player.y, stego, { d: '#173a3e', D: '#69e69a' });
      }
      function move(dx, dy) {
        if (won) return;
        const nx = player.x + dx, ny = player.y + dy;
        if (!maze[ny] || maze[ny][nx] === '#') return;
        player = { x: nx, y: ny }; steps++;
        document.getElementById('steps').textContent = steps;
        if (nx === goal.x && ny === goal.y) {
          won = true;
          const message = document.getElementById('message');
          message.textContent = `★ SNAIL RESCUED! ${steps} STEPS ★`;
          message.classList.add('won');
        }
        draw();
      }
      const directions = {
        ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
        ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
        ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
        ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
      };
      window.addEventListener('keydown', event => {
        if (directions[event.key]) { event.preventDefault(); move(...directions[event.key]); }
      });
      document.querySelectorAll('.dpad button').forEach(button => button.addEventListener('click', () => {
        const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        move(...dirs[button.dataset.dir]);
      }));
      document.getElementById('reset').addEventListener('click', () => {
        player = { ...start }; steps = 0; won = false;
        document.getElementById('steps').textContent = '0';
        const message = document.getElementById('message');
        message.textContent = 'Use arrow keys or WASD to guide Stego through the maze.';
        message.classList.remove('won'); draw();
      });
      maze = makeMaze(); player = { ...start }; draw();

      // Random positions, sizes, drift, and timing make the pixel hearts feel organic.
      const hearts = document.getElementById('hearts');
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.style.setProperty('--left', `${Math.random() * 100}%`);
        heart.style.setProperty('--size', `${10 + Math.random() * 13}px`);
        heart.style.setProperty('--duration', `${10 + Math.random() * 13}s`);
        heart.style.setProperty('--delay', `${-Math.random() * 22}s`);
        heart.style.setProperty('--drift', `${-45 + Math.random() * 90}px`);
        hearts.appendChild(heart);
      }
    })();
  </script>
</body>
</html>
